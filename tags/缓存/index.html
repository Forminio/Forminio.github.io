    var burger = document.getElementById('nav-burger');
    var drawer = document.getElementById('nav-drawer');
    if (!header || !burger || !drawer) return;

     
    function debounce(fn, wait) {
      var timer = null;
      return function () {
        var args = arguments, ctx = this;
        clearTimeout(timer);
        timer = setTimeout(function () { fn.apply(ctx, args); }, wait);
      };
    }

     
    var isOpen = false;

    function setOpen(next) {
      if (next === isOpen) return;
      isOpen = next;
      header.classList.toggle('nav-open', isOpen);
      burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      burger.setAttribute('aria-label', isOpen ? '关闭导航菜单' : '打开导航菜单');
      drawer.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
    }

    burger.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      setOpen(!isOpen);
    });

    

    drawer.addEventListener('click', function (e) {
      e.stopPropagation();
      if (e.target.closest('a[href]') || e.target.closest('button')) {
        setOpen(false);
      }
    });

     
    document.addEventListener('click', function (e) {
      if (!isOpen) return;
      if (drawer.contains(e.target) || burger.contains(e.target)) return;
      setOpen(false);
    });

     
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && isOpen) {
        setOpen(false);
        burger.focus();
      }
    });

     
    var THRESHOLD = 20;
    var ticking = false;
    var scrolled = false;

    function setScrolled(next) {
      if (next === scrolled) return;
      scrolled = next;
      header.classList.toggle('is-scrolled', next);
    }

    function updateState() {
      setScrolled((window.scrollY || window.pageYOffset || 0) > THRESHOLD);
      ticking = false;
    }

     
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(updateState);
    }

     
    var settle = debounce(updateState, 120);

    function handleScroll() {
      onScroll();
      settle();
    }

     
    var onResize = debounce(function () {
      setScrolled((window.scrollY || window.pageYOffset || 0) > THRESHOLD);
      if (window.innerWidth > 768) setOpen(false);
    }, 180);

    window.addEventListener('scroll', handleScroll, { passive: true });
    window.addEventListener('resize', onResize);

     
    window.addEventListener('pageshow', updateState);

    updateState();
  })();

  <script>
    (function() {
      function isLightMode() {
        return document.documentElement.classList.contains('light') ||
               (!document.documentElement.classList.contains('dark') && localStorage.getItem('appearance') === 'light');
      }
      function applyTheme() {
        var isLight = isLightMode();
        var nav = document.getElementById('nav-blur');
        if (!nav) return;
        nav.style.background = isLight ? 'var(--nav-bg-light)' : 'var(--nav-bg-dark)';
        var root = document.documentElement;
        root.classList.toggle('theme-light', isLight);
        root.classList.toggle('theme-dark', !isLight);
        var color = isLight ? 'var(--nav-font-light)' : 'var(--nav-font-dark)';
        var style = document.getElementById('nav-theme-style');
        if (!style) {
          style = document.createElement('style');
          style.id = 'nav-theme-style';
          document.head.appendChild(style);
        }
        style.textContent = '.main-menu a,.main-menu .bf-icon-color-hover,.main-menu span,.main-menu button{color:' + color + '!important}';
      }
      applyTheme();
      new MutationObserver(function(){ applyTheme(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    })();

  <script>
     
    (function () {
      var wrapper = document.getElementById('search-wrapper');
      var input = document.getElementById('search-query');
      var output = document.getElementById('search-results');
      if (!wrapper || !input || !output) return;
      var section = output.closest('section');
      if (!section) return;

      var countEl = document.createElement('div');
      countEl.className = 'search-result-count';
      countEl.hidden = true;
      section.insertBefore(countEl, output);

      function visibleCount() {
        var n = 0;
        Array.prototype.forEach.call(output.children, function (li) {
          if (li.nodeType !== 1) return;
          if (li.style.display === 'none') return;
          if (window.getComputedStyle(li).display === 'none') return;
          n++;
        });
        return n;
      }

      function hideResults() {
        section.hidden = true;
        countEl.hidden = true;
        countEl.textContent = '';
      }

      function sync() {
        if (!input.value.trim()) { hideResults(); return; }
        section.hidden = false;
        countEl.textContent = '找到 ' + visibleCount() + ' 个结果';
        countEl.hidden = false;
      }

       
      input.addEventListener('input', sync);
      input.addEventListener('keyup', function () { setTimeout(sync, 0); });

       
      new MutationObserver(sync).observe(output, { childList: true });

       
      var closeBtn = document.getElementById('close-search-button');
      if (closeBtn) closeBtn.addEventListener('click', hideResults);
      wrapper.addEventListener('click', function (e) {
        if (e.target === wrapper) hideResults();
      });
      new MutationObserver(function () {
        if (wrapper.style.visibility === 'hidden') hideResults();
      }).observe(wrapper, { attributes: true, attributeFilter: ['style'] });

      hideResults();
    })();
  </script>
  <script>
     
    (function () {
      var audio = document.getElementById('music-audio');
      var seek = document.getElementById('music-seek');
      var vol = document.getElementById('music-vol');
      if (!seek || !vol) return;

      function paint(el, name) {
        var max = parseFloat(el.max) || 100;
        var val = parseFloat(el.value) || 0;
        var pct = max > 0 ? Math.min(100, Math.max(0, (val / max) * 100)) : 0;
        el.style.setProperty(name, pct.toFixed(2) + '%');
      }
      function paintSeek() { paint(seek, '--seek-fill'); }
      function paintVol() { paint(vol, '--vol-fill'); }

      paintSeek();
      paintVol();
      seek.addEventListener('input', paintSeek);
      seek.addEventListener('change', paintSeek);
      vol.addEventListener('input', paintVol);
      if (audio) {
         
        audio.addEventListener('timeupdate', function () { requestAnimationFrame(paintSeek); });
        audio.addEventListener('loadedmetadata', paintSeek);
        audio.addEventListener('durationchange', paintSeek);
      }
      window.addEventListener('pageshow', function () { paintSeek(); paintVol(); });
    })();
  </script>
  <script>
    (function(){
      var cards=document.querySelectorAll('.glow-card'),rafId=0;
      cards.forEach(function(card){
        var spot=card.querySelector('.glow-card-spotlight');if(!spot)return;
        card.addEventListener('mousemove',function(e){
          if(rafId)cancelAnimationFrame(rafId);
          rafId=requestAnimationFrame(function(){
            var r=card.getBoundingClientRect();
            card.style.setProperty('--spot-x',((e.clientX-r.left)/r.width*100)+'%');
            card.style.setProperty('--spot-y',((e.clientY-r.top)/r.height*100)+'%');
            rafId=0;
          });
        },{passive:true});
        card.addEventListener('mouseleave',function(){
          if(rafId){cancelAnimationFrame(rafId);rafId=0;}
          card.style.removeProperty('--spot-x');
          card.style.removeProperty('--spot-y');
        });
      });
    })();

  <link rel="preconnect" href="https://api.injahow.cn" crossorigin>
  <script>
    (function () {
       
      var PLAYLIST_ID = '4947253034';  
       
      var APIS = [
        'https://metingapi.pages.dev/api?server=netease&type=playlist&id=' + PLAYLIST_ID,
        'https://api.injahow.cn/meting/?type=playlist&id=' + PLAYLIST_ID
      ];

      var ball = document.getElementById('music-ball');
      var panel = document.getElementById('music-panel');
      var audio = document.getElementById('music-audio');
      var listBox = document.getElementById('music-list');
      var nameEl = document.getElementById('music-name');
      var artistEl = document.getElementById('music-artist');
      var coverEl = document.getElementById('music-cover');
      var ballCover = document.getElementById('music-ball-cover');
      var modeBtn = document.getElementById('music-mode');
      var toggleBtn = document.getElementById('music-toggle');
      var icPlay = toggleBtn.querySelector('.ic-play');
      var icPause = toggleBtn.querySelector('.ic-pause');
      var volEl = document.getElementById('music-vol');
      var seekEl = document.getElementById('music-seek');
      var curEl = document.getElementById('music-cur');
      var durEl = document.getElementById('music-dur');
       
      function setBallPlaying(playing) {
        ball.classList.toggle('playing', playing);
      }
      function updateBallCover() {
        var t = tracks[index];
        if (!t) { ballCover.removeAttribute('src'); return; }
        ballCover.onerror = function () { ballCover.onerror = null; ballCover.src = PLACEHOLDER; };
        ballCover.src = t.pic || PLACEHOLDER;
      }
       
      var PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>' +
        '</linearGradient></defs>' +
        '<rect width="300" height="300" fill="url(#g)"/>' +
        '<text x="50%" y="55%" font-size="110" text-anchor="middle" fill="rgba(255,255,255,.88)" font-family="Georgia, serif">♪</text>' +
        '</svg>');

      var tracks = [];
      var index = 0;
      var seeking = false;
      var CACHE_KEY = 'fm_music_list_' + PLAYLIST_ID;
      var modes = ['list', 'one', 'shuffle'];
      var modeTitles = { list: '顺序播放', one: '单曲循环', shuffle: '随机播放' };
      var mode = localStorage.getItem('fm_music_mode') || 'list';
      var REPEAT_SVG = '<svg viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M0 224c0 17.7 14.3 32 32 32s32-14.3 32-32c0-53 43-96 96-96H320v32c0 12.9 7.8 24.6 19.8 29.6s25.7 2.2 34.9-6.9l64-64c12.5-12.5 12.5-32.8 0-45.3l-64-64c-9.2-9.2-22.9-11.9-34.9-6.9S320 19.1 320 32V64H160C71.6 64 0 135.6 0 224zm512 64c0-17.7-14.3-32-32-32s-32 14.3-32 32c0 53-43 96-96 96H192V352c0-12.9-7.8-24.6-19.8-29.6s-25.7-2.2-34.9 6.9l-64 64c-12.5 12.5-12.5 32.8 0 45.3l64 64c9.2 9.2 22.9 11.9 34.9 6.9s19.8-16.6 19.8-29.6V448H352c88.4 0 160-71.6 160-160z"/></svg>';
      var SHUFFLE_SVG = '<svg viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M403.8 34.4c12-5 25.7-2.2 34.9 6.9l64 64c6 6 9.4 14.1 9.4 22.6s-3.4 16.6-9.4 22.6l-64 64c-9.2 9.2-22.9 11.9-34.9 6.9s-19.8-16.6-19.8-29.6V160H352c-10.1 0-19.6 4.7-25.6 12.8L284 229.3 244 176l31.2-41.6C293.3 110.2 321.8 96 352 96h32V64c0-12.9 7.8-24.6 19.8-29.6zM164 282.7L204 336l-31.2 41.6C154.7 401.8 126.2 416 96 416H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H96c10.1 0 19.6-4.7 25.6-12.8L164 282.7zm274.6 188c-9.2 9.2-22.9 11.9-34.9 6.9s-19.8-16.6-19.8-29.6V416H352c-30.2 0-58.7-14.2-76.8-38.4L121.6 172.8c-6-8.1-15.5-12.8-25.6-12.8H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H96c30.2 0 58.7 14.2 76.8 38.4L326.4 339.2c6 8.1 15.5 12.8 25.6 12.8h32V320c0-12.9 7.8-24.6 19.8-29.6s25.7-2.2 34.9 6.9l64 64c6 6 9.4 14.1 9.4 22.6s-3.4 16.6-9.4 22.6l-64 64z"/></svg>';

      function setMode(m) {
        mode = m;
        localStorage.setItem('fm_music_mode', m);
        modeBtn.innerHTML = (m === 'shuffle' ? SHUFFLE_SVG : REPEAT_SVG);
        modeBtn.title = modeTitles[m];
        modeBtn.classList.toggle('mode-one', m === 'one');
      }

      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function fmtTime(s) {
        s = parseFloat(s);
        if (!isFinite(s) || s <= 0) return '0:00';
        var m = Math.floor(s / 60), sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }

      function renderList() {
        if (!tracks.length) { listBox.innerHTML = '<div class="music-status">歌单为空，请检查歌单 ID</div>'; return; }
        var html = tracks.map(function (t, i) {
          return '<div class="music-item" data-i="' + i + '">' +
            (t.pic ? '<img src="' + t.pic + '" alt="" loading="lazy">' : '') +
            '<div class="music-item-info"><div class="music-item-name">' + esc(t.name) + '</div>' +
            (t.artist ? '<div class="music-item-artist">' + esc(t.artist) + '</div>' : '') + '</div>' +
            (t.duration ? '<span class="music-item-time">' + fmtTime(t.duration) + '</span>' : '') +
            '</div>';
        }).join('');
        listBox.innerHTML = html;
        Array.prototype.forEach.call(listBox.querySelectorAll('.music-item img'), function (img) {
          img.addEventListener('error', function () {
            if (img.getAttribute('data-fb') !== '1') { img.setAttribute('data-fb', '1'); img.src = PLACEHOLDER; }
          });
        });
        Array.prototype.forEach.call(listBox.querySelectorAll('.music-item'), function (el) {
          el.addEventListener('click', function () { playTrack(parseInt(el.getAttribute('data-i'), 10)); });
        });
      }

      function renderNow() {
        var t = tracks[index];
        if (!t) { nameEl.textContent = '歌单加载中…'; artistEl.textContent = ''; coverEl.src = PLACEHOLDER; updateBallCover(); return; }
        nameEl.textContent = t.name;
        artistEl.textContent = t.artist;
        coverEl.onerror = function () { coverEl.onerror = null; coverEl.src = PLACEHOLDER; };
        coverEl.src = t.pic || PLACEHOLDER;
        updateBallCover();
        Array.prototype.forEach.call(listBox.querySelectorAll('.music-item'), function (el, i) {
          el.classList.toggle('active', i === index);
        });
      }

      function playTrack(i) {
        if (!tracks[i] || !tracks[i].url) return;
        index = i;
        localStorage.setItem('fm_music_index', i);
        localStorage.setItem('fm_music_time', '0');
        audio.src = tracks[i].url;
        audio.play().then(function () { renderNow(); }).catch(function () {});
      }

      function nextIndex() {
        if (mode === 'shuffle') return Math.floor(Math.random() * tracks.length);
        return (index + 1) % tracks.length;
      }

      function showLoadError() {
        nameEl.textContent = '歌单加载失败';
        artistEl.textContent = '';
        coverEl.src = PLACEHOLDER;
        updateBallCover();
        listBox.innerHTML = '<div class="music-status"><button type="button" id="music-retry" class="music-retry-btn">加载失败，点击重试</button></div>';
        var rb = document.getElementById('music-retry');
        if (rb) rb.addEventListener('click', loadTracks);
      }

      function loadTracks() {
        var cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          try {
            var arr = JSON.parse(cached);
            if (arr && arr.length) { tracks = arr; onTracksReady(); }
          } catch (e) {}
        }
        var apiIdx = 0;
        function tryNext() {
          if (apiIdx >= APIS.length) {
            if (!tracks.length) showLoadError();
            return;
          }
          fetch(APIS[apiIdx])
            .then(function (r) { return r.json(); })
            .then(function (data) {
               
              if (!data || !Array.isArray(data) || !data.length) { apiIdx++; tryNext(); return; }
              tracks = data.map(function (t) {
                 
                var idMatch = (t.lrc || t.url || '').match(/[?&]id=(\d+)/);
                return {
                  id: t.lrc || (idMatch ? idMatch[1] : ''),
                  name: t.name || t.title || '未知歌曲',
                  artist: t.artist || t.author || '',
                  url: t.url || '',
                  pic: (t.pic || '').replace(/^http:/, 'https:') || '',
                  duration: t.duration || 0
                };
              });
              try { localStorage.setItem(CACHE_KEY, JSON.stringify(tracks)); } catch (e) {}
              onTracksReady();
            })
            .catch(function () { apiIdx++; tryNext(); });
        }
        tryNext();
      }

      audio.addEventListener('ended', function () {
        if (mode === 'one') { audio.currentTime = 0; audio.play(); return; }
        playTrack(nextIndex());
      });
      audio.addEventListener('play', function () {
        icPlay.style.display = 'none'; icPause.style.display = '';
        localStorage.setItem('fm_music_playing', '1');
        setBallPlaying(true);
      });
      audio.addEventListener('pause', function () {
        icPlay.style.display = ''; icPause.style.display = 'none';
        localStorage.setItem('fm_music_playing', '0');
        setBallPlaying(false);
      });
      audio.addEventListener('loadedmetadata', function () {
        durEl.textContent = fmtTime(audio.duration);
      });
      var lastTimeSave = 0;
      audio.addEventListener('timeupdate', function () {
        if (seeking) return;
        var d = audio.duration || 0;
        if (d) seekEl.value = (audio.currentTime / d * 100).toFixed(1);
        curEl.textContent = fmtTime(audio.currentTime);
        var now = Date.now();
        if (now - lastTimeSave > 3000) {
          lastTimeSave = now;
          localStorage.setItem('fm_music_time', String(audio.currentTime));
        }
      });
      audio.addEventListener('pause', function () {
        localStorage.setItem('fm_music_time', String(audio.currentTime));
      });
      audio.addEventListener('ended', function () {
        localStorage.setItem('fm_music_time', '0');
      });
       
      window.addEventListener('pageshow', function (e) {
        if (e.persisted) {
          renderNow();
          setBallPlaying(!audio.paused);
          var d = audio.duration || 0;
          if (d) seekEl.value = (audio.currentTime / d * 100).toFixed(1);
          curEl.textContent = fmtTime(audio.currentTime);
        }
      });

      toggleBtn.addEventListener('click', function () {
        if (!tracks[index]) return;
        if (!audio.src && tracks[index].url) audio.src = tracks[index].url;
        if (audio.paused) { audio.play(); } else { audio.pause(); }
      });
      document.getElementById('music-prev').addEventListener('click', function () {
        if (!tracks.length) return;
        playTrack((index - 1 + tracks.length) % tracks.length);
      });
      document.getElementById('music-next').addEventListener('click', function () {
        if (!tracks.length) return;
        playTrack(nextIndex());
      });
      modeBtn.addEventListener('click', function () {
        setMode(modes[(modes.indexOf(mode) + 1) % modes.length]);
      });

       
      if (seekEl) {
        seekEl.addEventListener('input', function () {
          seeking = true;
          curEl.textContent = fmtTime((audio.duration || 0) * parseFloat(seekEl.value) / 100);
        });
        seekEl.addEventListener('change', function () {
          var d = audio.duration || 0;
          if (d) audio.currentTime = d * parseFloat(seekEl.value) / 100;
          seeking = false;
        });
      }

       
      function positionPanel() {
        var r = ball.getBoundingClientRect();
        var gap = 14;
        var pw = panel.offsetWidth || 300;
        var ph = panel.offsetHeight || 300;
        var vw = window.innerWidth, vh = window.innerHeight;
        panel.style.maxHeight = Math.max(200, vh - 16) + 'px';
        var dir = 'right', best = vw - r.right;
        if (r.left > best) { best = r.left; dir = 'left'; }
        if (vh - r.bottom > best) { best = vh - r.bottom; dir = 'bottom'; }
        if (r.top > best) { best = r.top; dir = 'top'; }
        panel.style.left = ''; panel.style.right = '';
        panel.style.top = ''; panel.style.bottom = '';
        if (dir === 'right') {
          panel.style.left = Math.max(8, Math.min(r.right + gap, vw - pw - 8)) + 'px';
          panel.style.top = Math.max(8, Math.min(r.top, vh - ph - 8)) + 'px';
        } else if (dir === 'left') {
          panel.style.left = Math.max(8, Math.min(r.left - gap - pw, vw - pw - 8)) + 'px';
          panel.style.top = Math.max(8, Math.min(r.top, vh - ph - 8)) + 'px';
        } else if (dir === 'bottom') {
          panel.style.top = Math.max(8, Math.min(r.bottom + gap, vh - ph - 8)) + 'px';
          panel.style.left = Math.max(8, Math.min(r.left, vw - pw - 8)) + 'px';
        } else {
          panel.style.top = Math.max(8, Math.min(r.top - gap - ph, vh - ph - 8)) + 'px';
          panel.style.left = Math.max(8, Math.min(r.left, vw - pw - 8)) + 'px';
        }
      }

       
      function restoreSession() {
        var saved = parseInt(localStorage.getItem('fm_music_index'), 10);
        if (!isFinite(saved) || !tracks[saved] || !tracks[saved].url) return;
        index = saved;
        renderNow();
        var savedTime = parseFloat(localStorage.getItem('fm_music_time')) || 0;
        var wasPlaying = localStorage.getItem('fm_music_playing') === '1';
        audio.src = tracks[index].url;
        audio.addEventListener('loadedmetadata', function once() {
          try {
            if (savedTime > 0 && isFinite(savedTime) && audio.duration) {
              audio.currentTime = Math.min(savedTime, audio.duration);
            }
          } catch (e) {}
          curEl.textContent = fmtTime(audio.currentTime);
          if (audio.duration) seekEl.value = (audio.currentTime / audio.duration * 100).toFixed(1);
        }, { once: true });
        audio.load();
        if (wasPlaying) {
          setBallPlaying(true);
          audio.play().catch(function () { setBallPlaying(false); });
        }
      }

      function onTracksReady() {
        renderList();
        restoreSession();
      }

       
      var dragging = false, moved = false, offX = 0, offY = 0;
      ball.addEventListener('mousedown', function (e) {
        dragging = true; moved = false;
        var r = ball.getBoundingClientRect();
        offX = e.clientX - r.left; offY = e.clientY - r.top;
        e.preventDefault();
      });
      window.addEventListener('mousemove', function (e) {
        if (!dragging) return;
        moved = true;
        var x = e.clientX - offX, y = e.clientY - offY;
        x = Math.max(0, Math.min(x, window.innerWidth - ball.offsetWidth));
        y = Math.max(0, Math.min(y, window.innerHeight - ball.offsetHeight));
        ball.style.left = x + 'px';
        ball.style.top = y + 'px';
        ball.style.right = 'auto';
        ball.style.bottom = 'auto';
      });
      window.addEventListener('mouseup', function () {
        if (dragging && !moved) {
          if (panel.classList.contains('open')) {
            panel.classList.remove('open');
          } else {
            positionPanel();
            panel.classList.add('open');
          }
        } else if (dragging) {
          localStorage.setItem('fm_ball_pos', ball.style.left + '|' + ball.style.top);
        }
        dragging = false;
      });
      ball.addEventListener('click', function (e) { e.preventDefault(); });

      document.getElementById('music-close').addEventListener('click', function () { panel.classList.remove('open'); });

       
      document.addEventListener('click', function (e) {
        if (panel.classList.contains('open') && !panel.contains(e.target) && !ball.contains(e.target)) {
          panel.classList.remove('open');
        }
      });

       
      (function () {
        var bp = localStorage.getItem('fm_ball_pos');
        if (bp) {
          var parts = bp.split('|');
          var x = parseFloat(parts[0]), y = parseFloat(parts[1]);
          if (isFinite(x) && isFinite(y)) {
            ball.style.left = x + 'px'; ball.style.top = y + 'px';
            ball.style.right = 'auto'; ball.style.bottom = 'auto';
          }
        }
      })();

      if (volEl) {
        audio.volume = parseFloat(localStorage.getItem('fm_music_volume')) || 0.8;
        volEl.value = audio.volume;
        volEl.addEventListener('input', function () {
          audio.volume = parseFloat(volEl.value);
          localStorage.setItem('fm_music_volume', volEl.value);
        });
      }

      setMode(mode);
      loadTracks();
    })();
  </script>
